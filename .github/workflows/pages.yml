name: Deploy catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest catalog archive
        run: |
          latest=""; lt=0
          for f in *.zip; do t=$(git log -1 --format=%ct -- "$f"); if [ "$t" -ge "$lt" ]; then lt=$t; latest="$f"; fi; done
          echo "Using: $latest"
          mkdir site
          unzip -q "$latest" -d site
          if [ ! -f site/index.html ]; then d=$(dirname $(find site -name index.html | head -1)); cp -r "$d"/. site/; fi
          touch site/.nojekyll
          ls site | head
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@v4
